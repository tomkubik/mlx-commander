[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-commander"
version = "0.2.0"
description = "CLI & TUI tool to convert Hugging Face datasets into Apple MLX dataset formats"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "MLX Dataset Converter Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "datasets>=2.14.0",
    "pyarrow>=12.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
mlx-commander = "mlx_commander.cli:main"

[tool.setuptools.packages.find]
include = ["mlx_commander*"]
